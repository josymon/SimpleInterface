<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  :root {
    /* Dark theme (default) */
    --bg: #0f172a;
    --panel-bg: #111827;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #3b82f6;
    --border: #1f2937;
    --hover: #1f2937;
    --preview-bg: #0b1220;
    --toggle-bg: #1f2937;
    --toggle-fg: #fbbf24; /* sun/moon color */
  }

  /* Light theme */
  body.light-mode {
    --bg: #f8fafc;
    --panel-bg: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --border: #e2e8f0;
    --hover: #f1f5f9;
    --preview-bg: #f1f5f9;
    --toggle-bg: #e2e8f0;
    --toggle-fg: #0f172a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.25s ease, color 0.25s ease;
  }

  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-bg);
    font-size: 14px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header-title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Theme toggle button */
  .theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--toggle-bg);
    color: var(--toggle-fg);
    cursor: pointer;
    font-size: 18px;
    transition: background 0.2s ease, transform 0.1s ease;
    flex: 0 0 36px;
  }

  .theme-toggle:hover {
    transform: translateY(-1px);
  }

  .theme-toggle:active {
    transform: translateY(0);
  }

  .container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left pane: file list */
  .sidebar {
    width: 280px;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    transition: background 0.25s ease, border-color 0.25s ease;
  }

  .sidebar-header {
    padding: 10px 12px;
    font-size: 13px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }

  .file-list {
    list-style: none;
    padding: 8px 0;
  }

  .file-item {
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .file-item:hover {
    background: var(--hover);
  }

  .file-item.active {
    background: var(--accent);
    color: #fff;
  }

  .file-icon {
    width: 16px;
    height: 16px;
    flex: 0 0 16px;
    display: inline-block;
    background: #334155;
    border-radius: 2px;
  }

  body.light-mode .file-icon {
    background: #cbd5e1;
  }

  .file-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Right pane: image preview */
  .preview {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: auto;
    background: var(--preview-bg);
    transition: background 0.25s ease;
  }

  .preview img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    background: #000;
  }

  body.light-mode .preview img {
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    background: #fff;
  }

  .empty-state {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
  }

  @media (max-width: 700px) {
    .container {
      flex-direction: column;
    }
    .sidebar {
      width: 100%;
      max-height: 40vh;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .preview {
      min-height: 60vh;
    }
  }
</style>
</head>
<body>
<header>
  <div class="header-title">
    PNG Gallery – click a file on the left to view it on the right.
  </div>
  <button class="theme-toggle" id="themeToggle" title="Toggle day/night mode" aria-label="Toggle day/night mode">
    🌙
  </button>
</header>

  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-header">Files</div>
      <ul class="file-list" id="fileList"></ul>
    </aside>

    <main class="preview" id="preview">
      <div class="empty-state">Select an image from the left pane.</div>
    </main>
  </div>
